plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
version = mod_version
group = 'net.gasharaujo.justgashloot'
base.archivesName = "${mod_id}-forge-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.resources.srcDir('../common/src/main/resources')
minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file(project.hasProperty('verification') ? 'build/verification-run' : "run/${name}")
            mods { "${mod_id}" { source sourceSets.main } }
            property 'justgashloot.verification', project.hasProperty('verification') ? 'true' : 'false'
        }
        client { }
        server { args '--nogui' }
    }
}
dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${loader_version}" }
tasks.named('jar').configure { finalizedBy 'reobfJar' }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = java_version as int }
tasks.named('processResources').configure {
    def properties = [mod_id:mod_id, mod_name:mod_name, mod_version:mod_version, mod_authors:mod_authors, minecraft_version:minecraft_version, loader_version:loader_version]
    inputs.properties properties
    filesMatching('META-INF/*.toml') { expand properties }
}
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from('../LICENSE')
    exclude('**/Verification*.class')
    exclude('data/justgashloot/**/verification/**')
}
if (project.hasProperty('verification')) {
    sourceSets.main.java.srcDir('../verification/src/main/java')
    sourceSets.main.java.srcDir('src/verification/java')
    sourceSets.main.resources.srcDir('src/verification/resources')
}

tasks.named('processResources').configure { inputs.property('verification', project.hasProperty('verification')) }

if (project.hasProperty('uiVerification')) {
    minecraft.runs.client.property 'justgashloot.uiVerification', 'true'
    minecraft.runs.client.workingDirectory project.file('build/ui-client')
    minecraft.runs.client.args '--quickPlaySingleplayer', 'JglGuiTest', '--username', 'JglGuiTest', '--width', '1280', '--height', '720'

}
if (project.hasProperty('jadeJar')) {
    dependencies { runtimeOnly files(project.property('jadeJar')) }
}

repositories { maven { url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } } }
dependencies { compileOnly fg.deobf('curse.maven:jade-324717:8479276') }
if (project.hasProperty('jadeRuntime')) { dependencies { runtimeOnly fg.deobf('curse.maven:jade-324717:8479276') } }
// Third-party refmaps use SRG names; the development client uses Mojang names.
if (project.hasProperty('jadeRuntime') || project.hasProperty('lootrRuntime')) {
    def refmapFile = layout.buildDirectory.file('jade-refmap/srg-to-mojang.srg')
    def refmapTask = tasks.register('prepareJadeRefmap') {
        dependsOn 'createMcpToSrg'
        inputs.file(layout.buildDirectory.file('createMcpToSrg/output.tsrg'))
        outputs.file(refmapFile)
        doLast {
            def output = refmapFile.get().asFile
            output.parentFile.mkdirs()
            net.minecraftforge.srgutils.IMappingFile.load(file('build/createMcpToSrg/output.tsrg')).reverse()
                    .write(output.toPath(), net.minecraftforge.srgutils.IMappingFile.Format.SRG, false)
        }
    }
    minecraft.runs.configureEach {
        property 'mixin.env.remapRefMap', 'true'
        property 'mixin.env.refMapRemappingFile', refmapFile.get().asFile.absolutePath
    }
    tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach { dependsOn refmapTask }
}

if (project.hasProperty('automationJar')) { dependencies { runtimeOnly files(project.property('automationJar')) } }

if (project.hasProperty('verification')) {
    tasks.matching { it.name == 'runServer' }.configureEach {
        doFirst { delete file('build/verification-run/verification-results.json') }
    }
    tasks.register('verifyServer') {
        dependsOn 'runServer'
        doLast {
            def report = file('build/verification-run/verification-results.json')
            if (!report.isFile() || !new groovy.json.JsonSlurper().parse(report).passed) {
                throw new GradleException('Integration checks failed; inspect verification-results.json and console output')
            }
        }
    }
}

minecraft.runs.configureEach { property 'justgashloot.expectLibrary', project.hasProperty('expectLibrary') ? 'true' : 'false' }

repositories { maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } } }
if (project.hasProperty('lootrRuntime')) { dependencies { runtimeOnly fg.deobf('maven.modrinth:lootr:mWTXC1ZX') } }

if (project.hasProperty('jeiJar')) {
    repositories { flatDir { dirs file(project.property('jeiJar')).parentFile } }
    dependencies { runtimeOnly fg.deobf("local.jei:jei-1.20.1-forge:${project.property('jeiVersion')}") }
}
if (project.hasProperty('recipeVerification')) { minecraft.runs.client.property 'justgashloot.recipeVerification', 'true' }
